{% extends 'noticias/base.html' %}

{% block titulo %}{{ titulo_pagina }} — Portal de Últimas Notícias de Maricá{% endblock %}

{% block content %}
    <section class="pagina-form">
        <h1>{{ titulo_pagina }}</h1>

        {% if post %}
            <p class="status-atual">
                Status atual: <span class="badge-status badge-status-{{ post.status }}">{{ post.get_status_display }}</span>
            </p>
        {% endif %}

        <form method="post" enctype="multipart/form-data" class="form-post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-acoes">
                <button type="submit" class="botao botao-primario">Salvar</button>
                <a href="{% url 'painel_editorial' %}" class="botao botao-secundario">Cancelar</a>
            </div>
        </form>
    </section>
{% endblock %}
